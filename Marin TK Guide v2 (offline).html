document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

s — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--ra st=\"{{ lk.items }}\" as=\"li\" hint-placeholder-count=\"2\"><a href=\"{{ li.url }}\" target=\"_blank\" rel=\"noopener\">{{ li.label }}<\u002Fa><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ isCommittee }}\" hint-placeholder-val=\"{{ false }}\">\n    <section id=\"committee\" style=\"max-width:1160px;margin:0 auto;padding:clamp(56px,8vw,88px) clamp(20px,5vw,64px) 8px;scroll-margin-top:64px\">\n      <div lang=\"en\" style=\"background:var(--color-surface);border-radius:calc(2 * var(--radius-lg));padding:clamp(24px,4vw,52px)\">\n        <div style=\"font-size:15px;font-weight:700;color:var(--color-accent-700)\">For the Ad Hoc Committee: Objectives 3 &amp; 4<\u002Fdiv>\n        <h2 style=\"font-size:clamp(28px,3.4vw,40px);line-height:1.1;margin:6px 0 0;color:var(--color-accent-500)\">Landscape snapshot &amp; what to collect<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.6;max-width:66ch;margin:14px 0 0\">Built from public district, county and state websites on October 22, 2026. Each district card above is a first draft of the annual TK list (Objective 3). The gaps below are things families need that aren’t posted anywhere.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:18px;margin-top:28px\">\n          <sc-for list=\"{{ stats }}\" as=\"sx\" hint-placeholder-count=\"4\">\n            <div style=\"width:178px;aspect-ratio:1;background:{{ sx.bg }};display:grid;place-content:center;text-align:center;padding:22px\">\n              <div style=\"font-family:var(--font-heading);font-size:44px;line-height:1;color:{{ sx.fg }}\">{{ sx.n }}<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.35;margin-top:8px;font-weight:700;color:color-mix(in srgb,var(--color-text) 80%,transparent)\">{{ sx.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <h3 style=\"color:var(--color-accent-500);font-size:24px;margin:40px 0 0\">Not available online: worth collecting<\u002Fh3>\n        <div style=\"overflow-x:auto;margin-top:14px\">\n          <div style=\"min-width:760px\">\n            <div style=\"display:grid;grid-template-columns:28px 1.3fr 1.4fr 1fr;gap:14px;padding:10px 4px;border-bottom:1px solid var(--color-divider);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:color-mix(in srgb,var(--color-text) 70%,transparent)\"><div>#<\u002Fdiv><div>What’s missing<\u002Fdiv><div>Why families need it<\u002Fdiv><div>Likely source<\u002Fdiv><\u002Fdiv>\n            <sc-for list=\"{{ gaps }}\" as=\"gp\" hint-placeholder-count=\"10\">\n              <div style=\"display:grid;grid-template-columns:28px 1.3fr 1.4fr 1fr;gap:14px;padding:12px 4px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);font-size:14px;line-height:1.45;align-items:start\">\n                <div style=\"font-family:var(--font-heading);color:var(--color-accent-700)\">{{ gp.n }}<\u002Fdiv>\n                <div style=\"font-weight:700\">{{ gp.what }}<\u002Fdiv>\n                <div>{{ gp.why }}<\u002Fdiv>\n                <div style=\"color:color-mix(in srgb,var(--color-text) 78%,transparent)\">{{ gp.where }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"color:var(--color-accent-500);font-size:24px;margin:40px 0 0\">Ties to the 2025-2030 Strategic Plan<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px;margin-top:14px\">\n          <sc-for list=\"{{ ties }}\" as=\"tt\" hint-placeholder-count=\"4\">\n            <div style=\"background:var(--color-bg);border-radius:0;padding:18px 20px;display:grid;gap:6px;align-content:start\">\n              <span class=\"tag tag-accent-2\" style=\"font-weight:700;justify-self:start;border-radius:2px\">{{ tt.code }}<\u002Fspan>\n              <div style=\"font-family:var(--font-heading);font-size:18px\">{{ tt.title }}<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.5\">{{ tt.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:28px 0 0;font-size:14px;line-height:1.55;max-width:70ch\"><strong>Keeping it current:<\u002Fstrong> each fall, confirm every district card (TK sites, hours, care and registration dates), update the income limits each July, and change the “checked” date in the header. Translations live in tk-i18n-es.js, tk-i18n-vi.js and tk-i18n-pt.js and should be reviewed by native speakers before publishing.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"sources\" style=\"max-width:1160px;margin:0 auto;padding:72px clamp(20px,5vw,64px) 8px\">\n    <h2 style=\"font-size:24px;margin:0;color:var(--color-accent-500)\">{{ t.sourcesH }}<\u002Fh2>\n    <p style=\"margin:8px 0 0;font-size:14px;line-height:1.55;max-width:70ch;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ t.sourcesP }}<\u002Fp>\n    <ul lang=\"en\" style=\"margin:16px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:8px 24px;font-size:13px;line-height:1.45\">\n      <sc-for list=\"{{ sources }}\" as=\"so\" hint-placeholder-count=\"12\"><li><a href=\"{{ so.url }}\" target=\"_blank\" rel=\"noopener\">{{ so.label }}<\u002Fa><\u002Fli><\u002Fsc-for>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <footer style=\"margin-top:72px;background:var(--color-accent-500);color:#fbfaea\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:28px clamp(20px,5vw,64px);display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center\">\n      <img src=\"c4a24284-412b-49fc-bbf2-002fd46b6937\" alt=\"Marin County Child Care Commission, Local Planning Council\" style=\"width:88px;height:88px;flex:none;background:#fff;border:5px solid var(--color-accent-2-100)\">\n      <p style=\"margin:0;flex:1 1 320px;max-width:72ch;font-size:14px;line-height:1.6\">{{ t.footer }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;audience&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Families&quot;,&quot;Committee&quot;],&quot;default&quot;:&quot;Families&quot;,&quot;tsType&quot;:&quot;'Families' | 'Committee'&quot;},&quot;showSources&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;heroPhoto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { lang: 'en', birth: '', prios: [], q: '', region: 'All', view: 'cards', fam: 4, income: '', per: 'year', checks: {}, open: {}, addr: '', geo: { status: 'idle' }, homeId: null, menuOpen: false,\n    narrow: typeof window !== 'undefined' && !!window.matchMedia && window.matchMedia('(max-width: 720px)').matches,\n    compactNav: typeof window !== 'undefined' && !!window.matchMedia && window.matchMedia('(max-width: 900px)').matches };\n\n  LANGS = [['en', 'English'], ['es', 'Español'], ['vi', 'Tiếng Việt'], ['pt', 'Português']];\n\n  componentDidMount() {\n    let lang = null;\n    try { lang = new URLSearchParams(window.location.search).get('lang') || window.localStorage.getItem('marin-tk-guide-lang'); } catch (e) {}\n    if (lang && this.LANGS.some(l => l[0] === lang)) this.setState({ lang });\n    this._onI18n = () => { this._cache = {}; this.forceUpdate(); };\n    window.addEventListener('tk-i18n', this._onI18n);\n    if (window.matchMedia) {\n      this._mqN = window.matchMedia('(max-width: 720px)');\n      this._mqC = window.matchMedia('(max-width: 900px)');\n      this._onMq = () => this.setState(st => ({ narrow: this._mqN.matches, compactNav: this._mqC.matches, menuOpen: this._mqC.matches ? st.menuOpen : false }));\n      [this._mqN, this._mqC].forEach(mq => mq.addEventListener ? mq.addEventListener('change', this._onMq) : mq.addListener(this._onMq));\n      this._onMq();\n    }\n    this._onKey = e => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); };\n    window.addEventListener('keydown', this._onKey);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('tk-i18n', this._onI18n);\n    window.removeEventListener('keydown', this._onKey);\n    [this._mqN, this._mqC].forEach(mq => mq && (mq.removeEventListener ? mq.removeEventListener('change', this._onMq) : mq.removeListener(this._onMq)));\n  }\n  setLang(lang) { this.setState({ lang }); try { window.localStorage.setItem('marin-tk-guide-lang', lang); } catch (e) {} }\n\n  matchDistrict(name) {\n    const n = (name || '').toLowerCase();\n    const rules = [['bolinas', 'bol'], ['kentfield', 'kent'], ['laguna joint', 'lagj'], ['lagunitas', 'lag'], ['larkspur', 'lcm'], ['mill valley', 'mvsd'], ['miller creek', 'mcsd'], ['dixie', 'mcsd'], ['nicasio', 'nic'], ['novato', 'nusd'], ['reed', 'rusd'], ['ross valley', 'rvsd'], ['ross', 'ross'], ['san rafael', 'srcs'], ['sausalito', 'smcsd'], ['shoreline', 'shore']];\n    const r = rules.find(([k]) => n.includes(k));\n    return r ? r[1] : null;\n  }\n  findDistrict(ev) {\n    if (ev && ev.preventDefault) ev.preventDefault();\n    const raw = (this.state.addr || '').trim();\n    if (!raw || this.state.geo.status === 'loading') return;\n    const q = /\\b(ca|calif\\.?|california)\\b/i.test(raw) || /\\b9\\d{4}\\b/.test(raw) ? raw : raw + ', CA';\n    const cb = '__tkGeo' + Math.random().toString(36).slice(2);\n    const s = document.createElement('script');\n    let done = false, timer = null;\n    const finish = (geo, homeId) => {\n      if (done) return; done = true;\n      clearTimeout(timer);\n      try { delete window[cb]; } catch (e) { window[cb] = undefined; }\n      s.remove();\n      this.setState(homeId ? { geo, homeId, region: 'All', q: '' } : { geo, homeId: null });\n    };\n    timer = setTimeout(() => finish({ status: 'error' }), 15000);\n    window[cb] = data => {\n      try {\n        const m = data && data.result && data.result.addressMatches && data.result.addressMatches[0];\n        if (!m) return finish({ status: 'notfound' });\n        const g = m.geographies || {};\n        const layer = word => { const k = Object.keys(g).find(x => x.toLowerCase().includes(word)); return k && g[k] && g[k][0] ? (g[k][0].NAME || g[k][0].BASENAME || '') : ''; };\n        const name = layer('elementary school') || layer('unified school');\n        if (!name) return finish({ status: 'unknown', matched: m.matchedAddress });\n        const id = this.matchDistrict(name);\n        if (id) finish({ status: 'found', matched: m.matchedAddress, census: name }, id);\n        else finish({ status: 'outside', matched: m.matchedAddress, census: name });\n      } catch (e) { finish({ status: 'error' }); }\n    };\n    s.onerror = () => finish({ status: 'error' });\n    s.src = 'https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress?address=' + encodeURIComponent(q) + '&benchmark=Public_AR_Current&vintage=Current_Current&layers=14,18&format=jsonp&callback=' + cb;\n    this.setState({ geo: { status: 'loading' } });\n    document.head.appendChild(s);\n  }\n\n  merge(a, b) {\n    if (b == null) return a;\n    if (Array.isArray(a)) return a.map((x, i) => this.merge(x, b[i]));\n    if (a && typeof a === 'object') { const o = { ...a }; for (const k of Object.keys(b)) o[k] = this.merge(a[k], b[k]); return o; }\n    return b;\n  }\n  dict() {\n    const lang = this.state.lang;\n    this._cache = this._cache || {};\n    if (!this._cache[lang]) {\n      const tr = (window.TK_I18N || {})[lang];\n      if (lang !== 'en' && !tr) return this.EN;\n      this._cache[lang] = lang === 'en' ? this.EN : this.merge(this.EN, tr);\n    }\n    return this._cache[lang];\n  }\n  f(str, v) { return String(str).replace(/\\{(\\w+)\\}/g, (m, k) => (v[k] != null ? v[k] : m)); }\n\n  EN = {\n    brand: 'Marin TK & Early Learning Guide', brandShort: 'Marin TK Guide', menu: 'Menu', close: 'Close',\n    nav: { year: 'Start age', options: 'Options', districts: 'Districts', paying: 'Paying', fit: 'Fit', dates: 'Dates', faq: 'FAQ' },\n    langLabel: 'Language', draft: '',\n    h1a: 'Your child is turning four.', h1b: 'Your options in Marin, in one place.',\n    heroP: 'Compare transitional kindergarten (TK), State Preschool, Head Start and child care in Marin County. See what each costs, the hours, who qualifies and how to apply, district by district.',\n    ctaYear: 'Check your child’s year', ctaDistrict: 'Find your district',\n    heroMeta: 'For the 2027-28 school year. Information checked October 2026.',\n    factsLabel: 'Quick facts',\n    f1n: 'Free', f1t: 'Public TK for every child who’s 4 by Sept. 1',\n    f2n: 'Your call', f2t: 'TK is optional. Preschool, Head Start or home are all fine.',\n    f3t: 'Adults to children, at minimum, in every TK classroom',\n    s1k: 'Step 1: Eligibility', s1h: 'When can my child start?',\n    s1p: 'The rule is the same in every California district: a child can start TK in the fall if they turn 4 on or before September 1. Enter a birthday to see your child’s years.',\n    bday: 'Child’s birthday', bdayHelp: 'Expecting? Enter the due date. Nothing you type here is saved or sent anywhere.',\n    ruleTK: 'Turns 4 on or before September 1', ruleK: 'Turns 5 on or before September 1', age6: 'Age 6', rule6: 'When school becomes required',\n    tlK: 'Your child’s timeline', tlEmpty: 'Enter a birthday to see when preschool, TK and kindergarten begin.', tlBad: 'That date doesn’t look right. Please check the year.',\n    s2k: 'Step 2: Options', s2h: 'What are my options?',\n    s2p: 'There are six main options for 3- to 5-year-olds in Marin. Being old enough for TK doesn’t limit your choices; you can pick any program your family qualifies for. Choose what matters most to your family an ation, so no transfer is needed.',\n    xferLinks: ['MCOE transfer guide and appeals', 'Appeal form', 'Appeal form in Spanish'],\n    fWhere: 'Where TK is', fDay: 'School day', fCare: 'Before & after care', fReg: 'Registration (last year)',\n    st: { offered: 'TK offered', changing: 'Changing', paused: 'No TK right now', confirm: 'Call to confirm TK' },\n    ask: 'Ask the district', charter: 'charter', enroll: 'Enrollment page', website: 'Website', contact: 'Contact', district: 'District', status: 'Status',\n    s4k: 'Step 4: Cost & help', s4h: 'How do we pay for it?',\n    s4p: 'TK itself is free. Costs usually come from care before and after school, during breaks and over the summer, or from choosing a private program. Below is what’s free and what help is available.',\n    freeH: 'Free, or free if you qualify',\n    free: [\n      ['Public TK', 'free for every child who’s 4 by September 1.'],\n      ['School meals', 'free breakfast and lunch for every public school student, TK included.'],\n      ['ELO-P after-school and summer care', 'free if your child qualifies for free or reduced-price meals, is in foster care or is experiencing homelessness. Others may pay a sliding-scale fee.'],\n      ['State Preschool', 'free or low-cost for families at or under the state income limit.'],\n      ['Head Start', 'free for families with low incomes or receiving public assistance.'],\n      ['MC3 child care subsidies', 'help paying a private preschool, family child care home or after-school program you choose, if your income is under the limit and you need care for work, school or training.'],\n      ['Playgroups', 'free parent-and-child playgroups through MC3.'],\n    ],\n    incH: 'Quick income check',\n    incP: 'This is an estimate based on 2026-27 state limits. The program or a counselor makes the final decision, and other situations can qualify, so apply even if you’re close.',\n    fam: 'People in your household', inc: 'Household income, before taxes', incPh: 'e.g. 95 y event to see Marin’s care options, held the Saturday before the Week of the Young Child (last held April 11, 2026). Date to be announced.' },\n      { w: 'May 2027', h: 'School placements', p: 'For example, Mill Valley sends placement letters around May 1. Sign up for before- and after-school care and ELO-P now.' },\n      { w: 'Jun to Jul 2027', h: 'Paperwork and a summer plan', p: 'Turn in immunization records and any health forms, and confirm care for August and summer.' },\n      { w: 'Mid-August 2027', h: 'First day of TK', p: 'Most Marin districts start in mid-August.' },\n      { w: 'Any time', h: 'Apply for free and low-cost programs', p: 'State Preschool, Head Start and the MC3 subsidy list take applications all year. Apply early, because there are more families than spaces.' },\n    ],\n    faqK: 'FAQ', faqH: 'Questions families ask', expandAll: 'Expand all', collapseAll: 'Collapse all',\n    linksK: 'Helpful links', linksH: 'People who can help',\n    links: [\n      { h: 'Marin County Office of Education', p: 'TK and Pre-K FAQs, toileting guides and every district’s enrollment link.', items: ['UPK for families', '“PreK or TK?” flyer', 'Flyer in Spanish'] },\n      { h: 'MC3 (Marin Child Care Council)', p: 'Free help finding child care, paying for it through subsidies, and joining parent playgroups. Counselors: 415-472-1092.', items: ['Find care', 'Help paying', 'Playgroups'] },\n      { h: 'Community Action Marin', p: 'Head Start and Early Head Start, plus the county’s largest state-subsidized preschool program.', items: ['Head Start', 'enrollment@camarin.org'] },\n      { h: 'California Universal PreK', p: 'The state’s family website, with short videos on TK and preschool choices for 4-year-olds.', items: ['For families', 'Videos'] },\n      { h: 'Checking a program’s quality', p: 'See programs in Marin Quality Counts, and look up any licensed center or home’s inspection record.', items: ['Marin Quality Counts', 'State licensing lookup'] },\n      { h: 'Development and disability support', p: 'Free evaluations and services for ages 3 to 5 through your school district, plus parent advocacy support.', items: ['Early Intervention, ages 3-5', 'Parents in Action'] },\n    ],\n    sourcesH: 'Sources', sourcesP: 'State and county sources first, with district and school websites for local details. Gathered in October 2026; programs change every year, so always confirm with the district or program before you decide.',\n    footer: 'Draft prepared for the Marin County Child Care Commission, Access & Advocacy Ad Hoc Committee. This is not legal or eligibility advice; programs make the final decisions.',\n    el: {\n      months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],\n      monthsShort: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],\n      date: '{month} {d}, {y}',\n      h2: 'TK starts in fall {y}', n2: 'That’s {n} school years away. Until then, preschool is an option from age 3 (see Step 2).',\n      h1: 'TK in {sy}', n1: 'Register this winter. Most Marin districts open TK registration between November and January for the fall.',\n      h0: 'TK-age right now ({sy})', n0: 'It’s not too late. Districts keep enrolling after their deadlines, so call your district (Step 3).',\n      hk: 'Kindergarten-age this year', nk: 'Your child is old enough for kindergarten in {sy}.',\n      hs: 'School-age', ns: 'This guide covers ages 3 to 5, and your child is already school-age.',\n      pre: 'Preschool', preWhen: 'From {mon} {y}', preSub: 'State Preschool, Head Start or private, from age 3',\n      tk: 'Transitional kindergarten', tkSub: 'Starts mid-August {y}, age {yr} yr {mo} mo',\n      k: 'Kindergarten', kSub: 'Starts mid-August {y}',\n      early: 'Turns 4 on {date}, during the {sy} school year. A few districts allow early TK enrollment after a child’s 4th birthday. It’s each district’s choice, so ask.',\n      young: 'Your child will be among the youngest in TK, which is normal because TK is designed for 4-year-olds. Step 5 can help you think about fit.',\n      old: 'Your child will be among the oldest in their TK class.',\n    },\n    options: [\n      { name: 'Public TK', full: 'Transitional kindergarten at your public school district', cost: 'Free',\n        rows: ['Every child who turns 4 by September 1 and lives in the district.', 'Set by each district, from a part-day session to a full school day.', 'Average class of 24 or fewer, with at least 1 adult for every 10 children.', 'Credentialed teacher with early-childhood training (24 ECE units or the equivalent).', 'Through your school district. Most open registration between November and January for the next fall.'],\n        plus: 'Year one of a two-year kindergarten program. Free school breakfast and lunch; before- and after-school care varies by school.',\n        fits: { free: 'yes, for every family', long: 'with aftercare or ELO-P', summer: 'ELO-P summer days if eligible', campus: 'yes', small: '1 adult per 10 kids' } },\n      { name: 'State Preschool', full: 'California State Preschool Program (CSPP)', cost: 'Free or low-cost if eligible',\n        rows: ['Ages 3 and 4 from families at or under the state income limit ($136,044 a year for a family of four in 2026-27), plus some other situations.', 'Part-day (about 3 to 3½ hours) or full-day programs.', 'At least 1 adult for every 8 children.', 'Teachers hold a state Child Development Permit.', 'Fill out one application, the Centralized Eligibility List (CEL), through MC3, or contact programs directly.'],\n        plus: 'Your child can choose State Preschool even if they’re old enough for TK.',\n        fits: { free: 'if your income qualifies', long: 'some full-day programs', summer: 'at some full-day programs', campus: 'some sites', small: 'yes, 1 adult per 8 kids' } },\n      { name: 'Head Start', full: 'Federally funded preschool, run in Marin by Community Action Marin', cost: 'Free if eligible',\n        rows: ['Ages 3 to 5 from families with low incomes or receiving public assistance, and children in foster care or experiencing homelessness.', 'Full-day, full-year.', 'Classes of about 20 with a teacher plus associate and assistant teachers.', 'Lead, associate and assistant teachers using a research-based curriculum.', 'Call Community Action Marin at 415-526-7500 or email enrollment@camarin.org.'],\n        plus: 'Includes health, nutrition and family support, and supports your child’s home language. Early Head Start serves ages 0 to 3.',\n        fits: { free: 'if your income qualifies', long: 'yes, full day', summer: 'yes, full year', campus: 'no', small: 'about 20 kids with several adults' } },\n      { name: 'Private preschool', full: 'Private preschool or Pre-K in a licensed center', cost: 'Tuition, or MC3 subsidy if eligible',\n        rows: ['Any family. Many programs take children from age 2.', 'Half-day to full-day; many run year-round.', 'Set by state licensing. Ask each program for its ratio.', 'Licensed centers require teachers with early-childhood coursework.', 'Directly with each program. To have an MC3 subsidy pay some or all of the cost, apply to the CEL and ask the program whether it accepts MC3 payments.'],\n        plus: 'Many private preschools accept MC3 subsidy payments for eligible families. A private school’s “TK” is tuition-based and doesn’t follow public TK rules.',\n        fits: { free: 'MC3 subsidy if eligible, otherwise tuition', long: 'often', summer: 'often year-round', campus: 'no', small: 'varies, so ask' } },\n      { name: 'Family child care', full: 'A licensed child care home', cost: 'Tuition, or MC3 subsidy if eligible',\n        rows: ['Any family; mixed ages from infants to school-age.', 'Often the most flexible, with early drop-off and late pickup.', 'A small group in the provider’s home.', 'State-licensed provider. Training varies, so ask.', 'Directly with the provider. Find licensed homes through MC3, and apply to the CEL if you may qualify for a subsidy.'],\n        plus: 'Siblings can stay together. Many homes accept MC3 subsidy payments, which can cover some or all of the cost.',\n        fits: { free: 'MC3 subsidy if eligible, otherwise tuition', long: 'often early and late', summer: 'usually year-round', campus: 'no, in a home', small: 'yes' } },\n      { name: 'Home and playgroups', full: 'Staying home, with playgroups and story times', cost: 'Free',\n        rows: ['Any family. TK and kindergarten are optional; school is required from age 6.', 'Your schedule.', 'Your family, plus playgroups.', 'You, with support from free parent-and-child playgroups.', 'MC3 playgroups and library story times.'],\n        plus: 'You can still enroll in TK or kindergarten later.',\n        fits: { free: 'yes', long: 'no', summer: 'no', campus: 'no', small: 'yes' } },\n    ],\n    districts: {\n      srcs: { towns: 'Most of San Rafael, including Santa Venetia and the Canal', where: 'Your neighborhood elementary school when space allows. Dual-language (English and Spanish) TK at Venetia Valley.', day: null, care: 'After-care and ELO-P options are listed by school on the district site.', reg: 'Online or at district events. The priority deadline was March 2, 2026, with info nights in November and December.', note: 'Bring the enrollment packet, proof of age, 2 proofs of address and immunization records. The page is in English and Spanish.' },\n      mcsd: { towns: 'Marinwood, Lucas Valley, northern San Rafael', statusText: 'Changing for 2027-28', where: 'Starting in 2027-28, all TK classes will be at one site: 380 Nova Albion Way.', day: 'Part-day (“minimum day”) program in morning or afternoon sessions.', care: 'The district says TK will have no childcare options starting in 2027-28, so plan for outside care.', reg: 'Opens in January 2027. Start at your neighborhood elementary school.', note: 'The district cites a lack of state TK funding for community-funded (“basic aid”) districts.' },\n      nusd: { towns: 'Novato, Hamilton, Bel Marin Keys', where: 'Novato elementary schools (ask which ones host TK). Lynwood is a dual-immersion school, and school tours are offered.', day: null, care: 'Free ELO-P after-school and summer care with the YMCA for eligible TK-6 students. The district also posts a school-by-school care list.', reg: 'Online enrollment opened Nov. 3, 2025, and the TK info night was Dec. 4, 2025 (recording online).', note: null },\n      nc: { towns: 'Open to families by application', where: 'Public charter school (K-8) at 940 C Street, Novato. Ask whether TK is offered.', day: null, care: null, reg: 'By application. See the school’s how-to-apply page.', note: 'A free public school. Admission is by application, not address.' },\n      mvsd: { towns: 'Mill Valley, Tam Valley, Homestead Valley, Strawberry, Almonte', statusText: 'TK offered 2026-27', where: 'The district assigns each child to one of its 5 elementary schools. Placement isn’t based on neighborhood.', day: 'Example: Tam Valley TK runs 8:15-2:35 (1:45 on Wednesdays), with no nap time.', care: null, reg: 'Last window: Dec. 3, 2025 to Jan. 30, 2026, with placement letters around May 1. Later applications are accepted.', note: 'Open to verified residents only, and the district doesn’t offer school tours. Confirm TK details each fall.' },\n      lcm: { towns: 'Larkspur, Corte Madera, parts of Greenbrae and Kentfield', statusText: 'No TK in 2025-26 or 2026-27', where: 'The district says it is not offering TK in 2025-26 or 2026-27. Plans for 2027-28 aren’t posted.', day: 'Not offered this year', care: 'Not offered this year', reg: 'Kindergarten enrolls in rounds. Interdistrict transfer requests are accepted Jan. 1 to Mar. 31.', note: 'Ask the district about 2027-28, and compare State Preschool, Head Start and private options.' },\n      rusd: { towns: 'Tiburon, Belvedere, part of east Corte Madera', statusText: 'Offered (called “PreK”)', where: 'Reed School (PreK-2), 1199 Tiburon Blvd.', day: null, care: 'Belvedere-Tiburon Child Care Center runs care on the Reed and Bel Aire campuses.', reg: 'Online PreK registration on the district site.', note: 'Some “Tiburon” addresses (Strawberry, Cypress Hollow) are in the Mill Valley district, so check which district you’re in.' },\n      smcsd: { towns: 'Sausalito, Marin City', where: 'Dr. Martin Luther King, Jr. Academy (K-8), 636 Nevada St. Ask about TK.', day: null, care: null, reg: 'Online enrollment (Aeries).', note: 'Horizon Community School in Sausalito runs a subsidized preschool with its own waitlist.' },\n      rvsd: { towns: 'San Anselmo, Fairfax, Sleepy Hollow', where: 'A TK class at each elementary school: Brookside, Hidden Valley, Manor and Wade Thomas.', day: null, care: null, reg: 'Opened Jan. 13, 2026 at 8 a.m. Finish by March 1 for your neighborhood school; full grades overflow to other schools.', note: 'Book tours through each school’s webpage.' },\n      rvc: { towns: 'Open to families by application', where: 'Public charter school. Admission is by application.', day: 'The TK and kindergarten day ends at 1:45 p.m.', care: null, reg: 'See the admissions page for dates.', note: null },\n      kent: { towns: 'Kentfield, part of Greenbrae', where: 'Anthony G. Bacich School (K-4), 25 McAllister Ave. Ask about TK.', day: null, care: null, reg: 'Online registration.', note: null },\n      ross: { towns: 'Ross', where: 'Ross School (K-8). Ask about TK.', day: null, care: null, reg: 'Online enrollment (Aeries).', note: null },\n      lag: { towns: 'San Geronimo Valley: Woodacre, Forest Knolls, Lagunitas, San Geronimo', where: 'Lagunitas School and San Geronimo Valley Elementary. Ask about TK.', day: null, care: null, reg: null, note: 'San Geronimo Preschool (subsidized) keeps its own waitlist.' },\n      bol: { towns: 'Bolinas, Stinson Beach', where: 'Stinson Beach campus (K-2) and Bolinas campus (3-8). Ask about TK.', day: null, care: null, reg: null, note: null },\n      shore: { towns: 'Point Reyes Station, Inverness, Olema, Marshall, Tomales, Dillon Beach', statusText: 'TK-12 district', where: 'West Marin and Inverness schools offer a combined TK-8 program. Ask about Tomales.', day: null, care: null, reg: 'Online enrollment isn’t posted yet, so call the district.', note: 'Shoreline also runs a subsidized preschool with its own waitlist.' },\n      nic: { towns: 'Nicasio', where: 'Nicasio School (K-8). Ask about TK.', day: null, care: null, reg: null, note: null },\n      lagj: { towns: 'Chileno Valley (rural northwest Marin)', where: 'Laguna School (K-6), Chileno Valley Road. Ask about TK.', day: null, care: null, reg: 'Online interest form.', note: null },\n    },\n    groups: [\n      { title: 'Your child', items: [\n        { label: 'Says goodbye to me with some support', tip: 'Practice short, predictable goodbyes. Ask how the school handles the first weeks.' },\n        { label: 'Uses the toilet mostly on their own (accidents happen)', tip: 'TK can’t turn a child away over toileting. Tell the school your plan. MCOE has free toileting guides in English and Spanish.', linkLabel: 'Toileting without Tears' },\n        { label: 'Can tell an adult what they need, in any language', tip: 'Home languages are a strength. Ask about bilingual staff, or dual-language TK in San Rafael and Novato.' },\n        { label: 'Is comfortable in a busy group of 20 or more kids', tip: 'If big groups are hard right now, compare smaller settings: State Preschool (1 adult per 8) or a family child care home.' },\n        { label: 'Can get through the day without a nap', tip: 'Many TK days have no nap time. Ask about rest time, or consider a part-day option this year.' },\n        { label: 'Manages a lunchbox, jacket and handwashing with a little help', tip: 'Practice zippers, containers and shoes at home. These are skills TK teaches, not entry requirements.' },\n      ] },\n      { title: 'Your family’s schedule', items: [\n        { label: 'The TK pickup time works with our work hours', tip: 'Ask for the exact bell schedule, since some districts run part-day morning or afternoon TK.' },\n        { label: 'We have before- and after-school care lined up', tip: 'Ask about on-campus care and ELO-P (free if you qualify). Sign up early, since spots can fill.' },\n        { label: 'We have a plan for school breaks and summer', tip: 'ELO-P covers at least 30 non-school days for eligible kids. Head Start and many full-day preschools run year-round.' },\n        { label: 'Drop-off works with siblings and commutes', tip: 'TK isn’t always at your neighborhood school. Some districts assign sites or put all TK classes in one place.' },\n      ] },\n      { title: 'The program', items: [\n        { label: 'I’ve toured, gone to an info night or watched a video', tip: 'Not every district offers tours, but the state’s short UPK videos show what TK looks like.', linkLabel: 'Watch the UPK videos' },\n        { label: 'I know the class size, adults per room and teacher training', tip: 'Public TK has an average of 24 or fewer children and 1 adult per 10 children. Ask preschools for their ratio and check their licensing record.' },\n        { label: 'I know our total cost, including tuition, care and summer', tip: 'TK is free, but the care around it may not be. Step 4 shows help you may qualify for, including MC3 subsidies.' },\n      ] },\n    ],\n    faqs: [\n      { q: 'Is TK required?', a: 'No. TK and kindergarten are optional in California; children must be enrolled in school by age 6. You can choose TK, preschool, Head Start, child care or staying home.' },\n      { q: 'Does TK cost anything?', a: 'Public TK is free, and California public schools serve free breakfast and lunch to every student, TK included. Before- and after-school care may cost money unless your child qualifies for free ELO-P or an MC3 subsidy.' },\n      { q: 'If my child is old enough for TK, can we still choose preschool?', a: 'Yes. State law says TK eligibility doesn’t affect eligibility for other programs, so a TK-age child can attend State Preschool, Head Start or a private preschool instead.' },\n      { q: 'Does my child need to be potty trained?', a: 'No. Districts must offer TK to every age-eligible child regardless of toilet-training status, and each district decides how to support children who are still learning. If your child has an IEP, plan it there.' },\n      { q: 'My child turns 4 after September 1. Can they start early?', a: 'Possibly. Some districts allow early enrollment after a child’s 4th birthday. It’s each district’s decision, so ask. Otherwise, preschool this year and TK next year is a common path.' },\n      { q: 'Is TK a full school day?', a: 'It depends on the district and school. Some run a full day (for example 8:15-2:35 at one Mill Valley school), and Miller Creek is moving to part-day morning or afternoon sessions in 2027-28. Ask for the bell schedule and the before- and after-care options.' },\n      { q: 'How big are TK classes, and who teaches?', a: 'State law requires an average of 24 or fewer children per TK class at each school and at least 1 adult for every 10 children. Teachers hold a teaching credential plus early-childhood training (24 ECE units or the equivalent).' },\n      { q: 'What do we need to register?', a: 'Usually proof of age (birth certificate or passport), proof you live in the district (2 to 4 documents, depending on the district), immunization records and the district’s enrollment forms. Many districts also ask for a health exam form.' },\n      { q: 'Our district isn’t offering TK, or changed it. Why?', a: 'A few community-funded (“basic aid”) districts say they get no added state money for TK, so they’ve limited or paused it. State law requires districts that offer kindergarten to offer TK. Ask your district and MCOE about your options, and compare State Preschool, Head Start and private programs.' },\n      { q: 'My child has a disability, or I’m worried about their development.', a: 'Your school district provides free evaluations and services for ages 3 to 5, including support in TK and preschool. Contact your district’s special education office or MCOE’s Early Intervention program.' },\n      { q: 'We speak another language at home.', a: 'Home languages are a strength. TK students aren’t given the state English-proficiency test (ELPAC). San Rafael offers dual-language TK at Venetia Valley, and Novato’s Lynwood is a dual-immersion school.' },\n      { q: 'What about after school and summer?', a: 'Districts that run the Expanded Learning Opportunities Program (ELO-P) offer TK-6 care that adds up to a 9-hour day, plus at least 30 non-school days, with 1 adult per 10 TK and kindergarten children. It’s free for children who qualify for free or reduced-price meals, are in foster care or are experiencing homelessness; others may pay a sliding-scale fee.' },\n      { q: 'Will my child repeat kindergarten?', a: 'No. TK is the first year of a two-year kindergarten program, with its own age-appropriate curriculum based on the state’s Preschool/TK Learning Foundations.' },\n    ],\n  };\n\n  U = {\n    mcoeUpk: 'https://www.marinschools.org/programs-services/services/early-childhood-education/upk/families',\n    mcoeDir: 'https://www.marinschools.org/districts-schools/districts/marin-county-school-districts',\n    cdeTk: 'https://www.cde.ca.gov/fg/it/tkfiscalfaq.asp',\n    ec48000: 'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=EDC&sectionNum=48000',\n    ec48200: 'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=EDC&sectionNum=48200',\n    elo: 'https://www.cde.ca.gov/ls/ex/elofaq.asp',\n    mb: 'https://www.cde.ca.gov/sp/cd/ci/mb2603.asp',\n    csppStaff: 'https://www.cde.ca.gov/sp/cd/ci/csppstaffqual.asp',\n    meals: 'https://www.cde.ca.gov/ls/nu/sn/cauniversalmeals.asp',\n    ab2268: 'https://www.cde.ca.gov/sp/ml/ab2268faqs.asp',\n    cdss: 'https://www.c
